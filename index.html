<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Note</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 18px;font:18px/1.65 Georgia,"Times New Roman",serif;color:#111;background:#fff}main{max-width:760px;margin:0 auto}img{display:block;width:100%;max-width:620px;height:auto;margin:0 auto 28px}#note{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body><main>
<img src="https://raw.githubusercontent.com/chrisoh2605/My-final-Goodbye/main/photo.jpg" alt="Photo">
<div id="note">Loading note…</div>
</main>
<script>
fetch("https://raw.githubusercontent.com/chrisoh2605/My-final-Goodbye/main/Note")
.then(r=>{if(!r.ok)throw Error("Could not load note");return r.text()})
.then(t=>{document.getElementById("note").textContent=t})
.catch(()=>{document.getElementById("note").textContent="The note could not be loaded. Open the Note file in this repository."});
</script>
</body></html>
